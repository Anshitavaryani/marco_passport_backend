services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Driven from .env so this always matches whatever the app itself
      # connects with (CENTRAL_MYSQL_USER=root / CENTRAL_MYSQL_PASSWORD).
      # A mismatch here is exactly what caused the app to fail to
      # authenticate the first time this was run.
      MYSQL_ROOT_PASSWORD: ${CENTRAL_MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${CENTRAL_MYSQL_DB:-app_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${CENTRAL_MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${CENTRAL_MYSQL_PASSWORD:-root}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Optional: run the app itself in Docker too. Most people developing
  # day-to-day on macOS will get better performance running `npm run dev`
  # directly on the host (against the mysql service above via
  # localhost:3306) instead of bind-mounting into a container.
  # ---------------------------------------------------------------------
  # app:
  #   build:
  #     context: .
  #     target: development
  #   env_file: .env
  #   environment:
  #     CENTRAL_MYSQL_HOST: mysql
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - .:/usr/src/app
  #     - /usr/src/app/node_modules
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

volumes:
  mysql_data: